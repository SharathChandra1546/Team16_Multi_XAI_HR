<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | Risk Explainer</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root { color-scheme: light dark; --bg:#f7f7f4; --text:#1b1f24; --muted:#4b5563; --accent:#0b6e69; --accent-text:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151718; --text:#f2f3f4; --muted:#b4bac2; --accent:#3fb8af; --accent-text:#0b1a19; } }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 96px 16px; }
  h1 { font-size: 2rem; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.6; }
  a.button { display:inline-block; margin-top: 16px; background: var(--accent); color: var(--accent-text); padding: 10px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; }
  a.button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>The page you asked for does not exist. It may have moved, or the address may be mistyped.</p>
  <a class="button" href="/">Go to the home page</a>
</main>
</body>
</html>
